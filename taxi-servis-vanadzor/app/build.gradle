plugins { id 'com.android.application' }

android {
    namespace 'am.taxiservis.vanadzor'
    compileSdk 35
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("ANDROID_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    defaultConfig {
        applicationId 'am.taxiservis.vanadzor'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    flavorDimensions += 'role'
    productFlavors {
        passenger {
            dimension 'role'
            applicationIdSuffix '.passenger'
            resValue 'string', 'app_name', 'Taxi Servis Vanadzor — Ուղևոր'
            buildConfigField 'String', 'APP_ROLE', '"passenger"'
        }
        driver {
            dimension 'role'
            applicationIdSuffix '.driver'
            resValue 'string', 'app_name', 'Taxi Servis Vanadzor — Վարորդ'
            buildConfigField 'String', 'APP_ROLE', '"driver"'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
