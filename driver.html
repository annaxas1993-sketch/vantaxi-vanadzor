<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VanTaxi — Վարորդ</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17202a;font-family:system-ui,Arial}.wrap{max-width:760px;margin:auto;padding:20px 14px}.brand{font-size:27px;font-weight:850;color:#087e8b}.card,.ride{background:#fff;padding:18px;border-radius:15px;margin:14px 0;box-shadow:0 5px 20px #10203010}input,button{width:100%;padding:12px;margin:7px 0;border-radius:9px;border:1px solid #cbd5df;font:inherit}button{background:#087e8b;color:white;font-weight:700;border:0;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:8px}.row button{flex:1}.muted{color:#607080}#msg{font-weight:650}</style></head>
<body><main class="wrap"><div class="brand">🚕 VanTaxi · Վարորդ</div><section class="card" id="loginBox"><h2>Վարորդի մուտք</h2><p class="muted">Մուտք գործեք ձեր գրանցված հաշվի տվյալներով։</p><form id="login"><input id="email" type="email" autocomplete="username" required placeholder="Էլ․ փոստ"><input id="password" type="password" autocomplete="current-password" required placeholder="Գաղտնաբառ"><button>Մուտք գործել</button></form><div id="msg" role="status"></div></section><section id="app" hidden><div class="row"><button id="refresh">Թարմացնել պատվերները</button><button id="logout">Ելք</button></div><p id="welcome"></p><div id="rides"></div></section></main>
<script>
const URL="https://itcismqoozcevvrthgve.supabase.co", KEY="sb_publishable_ZuV-MRbChdSIybvepuOz5g_jYEgW52n";let token='',user=null,profile=null;
const headers=()=>({'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'});
const msg=document.getElementById('msg');
async function api(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{...headers(),...(opts.headers||{})}});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null;}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Մուտք…';try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw Error(data.msg||data.message||'Մուտքը չհաջողվեց');token=data.access_token;user=data.user;const ps=await api('/rest/v1/profiles?select=id,full_name,role,active,is_available&id=eq.'+encodeURIComponent(user.id));profile=ps[0];if(!profile||profile.role!=='driver'||!profile.active)throw Error('Այս հաշիվը ակտիվ վարորդի հաշիվ չէ։');document.getElementById('loginBox').hidden=true;document.getElementById('app').hidden=false;document.getElementById('welcome').textContent='Բարի գալուստ, '+(profile.full_name||'վարորդ');await load();}catch(err){msg.textContent='Սխալ՝ '+err.message;}});
async function load(){const box=document.getElementById('rides');box.innerHTML='<p>Բեռնվում է…</p>';try{const rows=await api('/rest/v1/rides?select=*&or=(status.eq.new,assigned_driver.eq.'+user.id+')&order=created_at.desc&limit=50');box.innerHTML='';if(!rows.length){box.innerHTML='<p class="muted">Այս պահին պատվերներ չկան։</p>';return;}for(const x of rows){const el=document.createElement('article');el.className='ride';const title=document.createElement('h3');title.textContent='Պատվեր · '+x.status;const details=document.createElement('p');details.textContent='Վերցնել՝ '+x.pickup_address+' | Գնալ՝ '+x.destination_address+' | Հեռ․՝ '+x.customer_phone;const claim=document.createElement('button');claim.textContent=x.status==='new'?'Ընդունել պատվերը':'Թարմացնել կարգավիճակը';claim.onclick=()=>x.status==='new'?claimRide(x.id):nextStatus(x);el.append(title,details,claim);box.append(el);}}catch(e){box.innerHTML='<p>Պատվերները բեռնել չհաջողվեց։ Ստուգեք վարորդի մուտքն ու բազայի թույլտվությունները։</p>';console.error(e);}}
async function claimRide(id){try{await api('/rest/v1/rpc/claim_vantaxi_ride',{method:'POST',body:JSON.stringify({p_ride_id:id})});await load();}catch(e){alert('Պատվերը հնարավոր է արդեն ընդունված է։ '+e.message);await load();}}
async function nextStatus(x){const states=['accepted','approaching','with_passenger','completed'];const idx=states.indexOf(x.status);const next=states[Math.min(idx+1,states.length-1)];if(next===x.status)return;try{await api('/rest/v1/rpc/update_vantaxi_ride_status',{method:'POST',body:JSON.stringify({p_ride_id:x.id,p_status:next})});await load();}catch(e){alert('Կարգավիճակը չփոխվեց։ '+e.message);}}
document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{try{await fetch(URL+'/auth/v1/logout',{method:'POST',headers:headers()});}catch{}location.reload();};
</script></body></html>
