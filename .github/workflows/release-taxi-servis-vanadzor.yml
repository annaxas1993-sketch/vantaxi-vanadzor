name: Build Taxi Servis Vanadzor Android apps
on:
  workflow_dispatch:
  push:
    branches:
      - taxi-servis-vanadzor-fresh
    paths:
      - '.github/workflows/release-taxi-servis-vanadzor.yml'
      - 'taxi-servis-vanadzor/**'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: taxi-servis-vanadzor-fresh
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Check and configure private signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "available=false" >> "$GITHUB_OUTPUT"
          if [[ -z "$KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "Private signing secrets are missing; will build installable debug APKs."
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode --ignore-garbage > "$RUNNER_TEMP/taxi-servis-release.jks"; then
            echo "Keystore Base64 could not be decoded; will build installable debug APKs."
            exit 0
          fi
          if [[ ! -s "$RUNNER_TEMP/taxi-servis-release.jks" ]]; then
            echo "Keystore file is empty; will build installable debug APKs."
            exit 0
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/taxi-servis-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "Keystore validation failed (bad keystore or password); will build installable debug APKs."
            exit 0
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/taxi-servis-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build three signed release APKs and Play bundles
        if: steps.signing.outputs.available == 'true'
        working-directory: taxi-servis-vanadzor
        run: gradle --no-daemon assemblePassengerRelease assembleDriverRelease assembleDispatcherRelease bundlePassengerRelease bundleDriverRelease bundleDispatcherRelease
      - name: Upload signed release APKs and bundles
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Servis-Vanadzor-SIGNED-RELEASE
          path: |
            taxi-servis-vanadzor/app/build/outputs/apk/passenger/release/*.apk
            taxi-servis-vanadzor/app/build/outputs/apk/driver/release/*.apk
            taxi-servis-vanadzor/app/build/outputs/apk/dispatcher/release/*.apk
            taxi-servis-vanadzor/app/build/outputs/bundle/passengerRelease/*.aab
            taxi-servis-vanadzor/app/build/outputs/bundle/driverRelease/*.aab
            taxi-servis-vanadzor/app/build/outputs/bundle/dispatcherRelease/*.aab
          if-no-files-found: error
          retention-days: 30
      - name: Build three installable debug APKs (signing-key fallback)
        if: steps.signing.outputs.available != 'true'
        working-directory: taxi-servis-vanadzor
        run: gradle --no-daemon assemblePassengerDebug assembleDriverDebug assembleDispatcherDebug
      - name: Upload three debug APKs
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Taxi-Servis-Vanadzor-DEBUG-APKS
          path: |
            taxi-servis-vanadzor/app/build/outputs/apk/passenger/debug/*.apk
            taxi-servis-vanadzor/app/build/outputs/apk/driver/debug/*.apk
            taxi-servis-vanadzor/app/build/outputs/apk/dispatcher/debug/*.apk
          if-no-files-found: error
          retention-days: 30
