name: Build VanTaxi Passenger and Driver APKs
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build passenger and driver APKs
        run: gradle assemblePassengerDebug assembleDriverDebug
      - name: Upload passenger APK
        uses: actions/upload-artifact@v4
        with:
          name: vantaxi-passenger-apk
          path: app/build/outputs/apk/passenger/debug/app-passenger-debug.apk
          if-no-files-found: error
      - name: Upload driver APK
        uses: actions/upload-artifact@v4
        with:
          name: vantaxi-driver-apk
          path: app/build/outputs/apk/driver/debug/app-driver-debug.apk
          if-no-files-found: error
