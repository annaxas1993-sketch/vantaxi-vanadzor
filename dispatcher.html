<!doctype html>
<html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VanTaxi — Դիսպետչեր</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#17202a;font-family:system-ui,Arial}.wrap{max-width:1000px;margin:auto;padding:20px 14px}.brand{font-size:27px;font-weight:850;color:#087e8b}.card,.ride{background:white;padding:18px;border-radius:15px;margin:14px 0;box-shadow:0 5px 20px #10203010}input,select,button{padding:11px;margin:6px 0;border-radius:9px;border:1px solid #cbd5df;font:inherit}input{width:100%}button{background:#087e8b;color:white;font-weight:700;border:0;cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}.ride{display:grid;grid-template-columns:1fr;gap:7px}.muted{color:#607080}#msg{font-weight:650}</style></head>
<body><main class="wrap"><div class="brand">🚕 VanTaxi · Դիսպետչեր</div><section class="card" id="loginBox"><h2>Դիսպետչերի մուտք</h2><form id="login"><input id="email" type="email" required placeholder="Էլ․ փոստ"><input id="password" type="password" required placeholder="Գաղտնաբառ"><button>Մուտք գործել</button></form><div id="msg" role="status"></div></section><section id="app" hidden><div class="row"><button id="refresh">Թարմացնել</button><button id="autoAssign">Ավտոմատ բաշխել նոր պատվերները</button><button id="logout">Ելք</button></div><h2>Պատվերներ</h2><div id="rides"></div></section></main>
<script>
const URL="https://itcismqoozcevvrthgve.supabase.co",KEY="sb_publishable_ZuV-MRbChdSIybvepuOz5g_jYEgW52n";let token='',user=null,profile=null;const headers=()=>({'apikey':KEY,'Authorization':'Bearer '+token,'Content-Type':'application/json'});const msg=document.getElementById('msg');
async function api(path,opts={}){const r=await fetch(URL+path,{...opts,headers:{...headers(),...(opts.headers||{})}});const t=await r.text();if(!r.ok)throw Error(t||('HTTP '+r.status));return t?JSON.parse(t):null;}
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Մուտք…';try{const r=await fetch(URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.msg||d.message||'Մուտքը չհաջողվեց');token=d.access_token;user=d.user;const p=await api('/rest/v1/profiles?select=id,full_name,role,active&id=eq.'+encodeURIComponent(user.id));profile=p[0];if(!profile||!profile.active||!['dispatcher','admin'].includes(profile.role))throw Error('Այս հաշիվը ակտիվ դիսպետչերի/ադմինի հաշիվ չէ։');document.getElementById('loginBox').hidden=true;document.getElementById('app').hidden=false;await load();}catch(e){msg.textContent='Սխալ՝ '+e.message;}});
async function load(){const box=document.getElementById('rides');box.textContent='Բեռնվում է…';try{const rows=await api('/rest/v1/rides?select=*&order=created_at.desc&limit=100');box.innerHTML='';if(!rows.length){box.textContent='Պատվերներ չկան։';return;}for(const x of rows){const el=document.createElement('article');el.className='ride';const h=document.createElement('h3');h.textContent='Պատվեր · '+x.status;const p=document.createElement('p');p.textContent=(x.customer_name||'Ուղևոր')+' · '+x.customer_phone+' · '+x.pickup_address+' → '+x.destination_address;const info=document.createElement('p');info.className='muted';info.textContent='Ստեղծվել է՝ '+new Date(x.created_at).toLocaleString('hy-AM')+' · ID '+x.id;const row=document.createElement('div');row.className='row';const inp=document.createElement('input');inp.placeholder='Վարորդի UUID';inp.value=x.assigned_driver||'';inp.style.flex='1';const assign=document.createElement('button');assign.textContent='Նշանակել վարորդ';assign.onclick=()=>assignDriver(x.id,inp.value);const status=document.createElement('select');['new','assigned','accepted','approaching','with_passenger','completed','cancelled'].forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;o.selected=s===x.status;status.append(o)});const change=document.createElement('button');change.textContent='Փոխել կարգավիճակը';change.onclick=()=>changeStatus(x.id,status.value);row.append(inp,assign,status,change);el.append(h,p,info,row);box.append(el);}}catch(e){box.textContent='Բեռնումը չհաջողվեց։ Ստուգեք դիսպետչերի RLS թույլտվությունները։';console.error(e);}}
async function assignDriver(id,driver){if(!driver.trim()){alert('Մուտքագրեք վարորդի պրոֆիլի UUID-ը։');return;}try{await api('/rest/v1/rides?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({assigned_driver:driver.trim(),status:'assigned',assigned_by:user.id})});await load();}catch(e){alert('Վարորդին նշանակել չհաջողվեց։ '+e.message);}}
async function changeStatus(id,status){try{await api('/rest/v1/rpc/update_vantaxi_ride_status',{method:'POST',body:JSON.stringify({p_ride_id:id,p_status:status})});await load();}catch(e){alert('Կարգավիճակը չփոխվեց։ '+e.message);}}
document.getElementById('autoAssign').onclick=async()=>{const b=document.getElementById('autoAssign');b.disabled=true;b.textContent='Բաշխվում է…';try{const rows=await api('/rest/v1/rides?select=id&status=eq.new&assigned_driver=is.null&order=created_at.asc&limit=100');let ok=0;const errors=[];for(const ride of rows){try{await api('/rest/v1/rpc/auto_assign_vantaxi_ride',{method:'POST',body:JSON.stringify({p_ride_id:ride.id})});ok++;}catch(e){errors.push(e.message);}}alert('Ավտոմատ բաշխված պատվերներ՝ '+ok+(errors.length?'\\nՉբաշխված՝ '+errors.length+' (հնարավոր է վարորդ չկա կամ պատվերը արդեն վերցված է).':''));await load();}catch(e){alert('Ավտոմատ բաշխումը չհաջողվեց։ '+e.message);}finally{b.disabled=false;b.textContent='Ավտոմատ բաշխել նոր պատվերները';}};document.getElementById('refresh').onclick=load;document.getElementById('logout').onclick=async()=>{try{await fetch(URL+'/auth/v1/logout',{method:'POST',headers:headers()});}catch{}location.reload();};
</script></body></html>
