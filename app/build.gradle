plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

android {
    namespace 'com.vantaxi.vanadzor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vantaxi.vanadzor'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }

    flavorDimensions += 'audience'
    productFlavors {
        passenger {
            dimension 'audience'
            applicationIdSuffix '.passenger'
            versionNameSuffix '-passenger'
            buildConfigField 'String', 'SITE_URL', '"https://jocular-dasik-f651c6.netlify.app/index.html"'
            resValue 'string', 'app_name', 'VanTaxi Ուղևոր'
        }
        driver {
            dimension 'audience'
            applicationIdSuffix '.driver'
            versionNameSuffix '-driver'
            buildConfigField 'String', 'SITE_URL', '"https://jocular-dasik-f651c6.netlify.app/driver.html"'
            resValue 'string', 'app_name', 'VanTaxi Վարորդ'
        }
    }

    buildFeatures {
        buildConfig true
    }
}
